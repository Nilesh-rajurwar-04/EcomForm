<!DOCTYPE html>
<html>
  <head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />

    <script>
      function validateForm() {
        let name = document.forms["myForm"]["name"].value.trim();
        let email = document.forms["myForm"]["email"].value.trim();
        let mobile = document.forms["myForm"]["mobile"].value.trim();
        let address = document.forms["myForm"]["address"].value.trim();
        let gender = document.forms["myForm"]["gender"].value;

        if (name === "" || email === "" || mobile === "" || address === "") {
          alert("All fields are required!");
          return false;
        }

        let emailPattern = /^[A-Za-z0-9+_.-]+@(.+)$/;
        if (!emailPattern.test(email)) {
          alert("Invalid Email Format!");
          return false;
        }

        if (!/^\d{10}$/.test(mobile)) {
          alert("Mobile number must be 10 digits!");
          return false;
        }

        if (!gender) {
          alert("Please select gender!");
          return false;
        }

        return true;
      }
    </script>
  </head>

  <body>
    <div class="container">
      <h2>Customer Registration</h2>

      <form
        name="myForm"
        action="result.jsp"
        method="post"
        onsubmit="return validateForm()"
      >
        <label>Name:</label>
        <input type="text" name="name" />

        <label>Email:</label>
        <input type="text" name="email" />

        <label>Mobile:</label>
        <input type="text" name="mobile" />

        <label>Address:</label>
        <textarea name="address"></textarea>

        <div class="gender">
          <label>Gender:</label><br />
          <input type="radio" name="gender" value="Male" /> Male
          <input type="radio" name="gender" value="Female" /> Female
        </div>

        <input type="submit" value="Submit" class="btn" />
      </form>
    </div>
  </body>
</html>
